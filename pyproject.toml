[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emot"
version = "1.0.0"
description = "Edge multi-object tracking: YOLO backbone benchmark, ByteTrack vs DeepSORT, ONNX/quantized export, MOT17 analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Javier Gómez Pulido" }]
keywords = ["multi-object-tracking", "yolo", "bytetrack", "botsort", "deepsort", "reid", "onnx", "edge-ai", "mot17"]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "motmetrics>=1.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "optuna>=3.6",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13.7",
    "onnxslim>=0.1.34",
]

[project.scripts]
emot = "emot.cli:app"

[project.urls]
Homepage = "https://github.com/fragompul/edge-multi-object-tracking"
Demo = "https://fragompul.github.io/edge-multi-object-tracking/"

[project.optional-dependencies]
dashboard = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
]
agent = [
    "anthropic>=0.40",
]
vision = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocs<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer option declarations carry their help text inline
"src/emot/cli.py" = ["E501"]
"scripts/*.py" = ["E501"]
"dashboard/**/*.py" = ["E501"]
"dashboard/*.py" = ["E501"]
# answer templates read better as long f-strings
"src/emot/agent/planner.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
