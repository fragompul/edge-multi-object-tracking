name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"
      - name: Lint with ruff
        run: ruff check src tests dashboard
      - name: Type-check with mypy
        run: mypy src dashboard
      - name: Run unit tests
        run: pytest tests/unit --cov=emot --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests (real YOLO11n checkpoint)
        run: pytest tests/integration -v

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dashboard]"
      - name: Start dashboard and verify every page loads (empty-results state)
        run: |
          python dashboard/app.py &
          APP_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8050/ > /dev/null && break
            sleep 1
          done
          for path in "/" "/backbone-benchmark" "/tracker-comparison" "/sequence-explorer" "/analytics"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8050$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAILED: $path returned $code"
              kill $APP_PID
              exit 1
            fi
          done
          kill $APP_PID
